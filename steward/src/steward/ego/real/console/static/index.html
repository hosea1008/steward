<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steward · 真机控制台</title>
<link rel="stylesheet" href="/console/style.css">
<script type="module" src="/console/app.js"></script>
</head>
<body>
<header>
  <h1>Steward <span data-i18n="title"></span></h1>
  <label class="sr-only" for="robot" data-i18n="configuration"></label>
  <select id="robot"></select>
  <button id="connect" data-i18n="connect"></button>
  <button id="disconnect" disabled data-i18n="disconnect"></button>
  <span id="phase" class="pill"></span>
  <span class="spacer"></span><span class="local" data-i18n="local"></span>
</header>
<main>
  <div id="error" class="notice error" role="alert" hidden></div>
  <section class="identity card">
    <div><div class="eyebrow" data-i18n="workspace"></div><h2 id="robot-name">Agilex Cobot Magic</h2><p id="description"></p></div>
    <div class="identity-status"><span class="dot"></span><span data-i18n="readOnly"></span></div>
  </section>
  <div class="layout">
    <div class="left-column">
      <section class="card cameras-section">
        <div class="section-title"><h2 data-i18n="cameras"></h2><span id="camera-count" class="muted"></span><span class="spacer"></span><span class="muted" id="camera-rate"></span></div>
        <div id="cameras" class="camera-grid"></div>
      </section>
      <section class="card">
        <div class="section-title"><h2 data-i18n="connections"></h2><span class="muted" data-i18n="connectionHint"></span></div>
        <div id="devices" class="device-grid"></div>
        <details class="configuration"><summary data-i18n="configurationDetails"></summary><pre id="config-json"></pre></details>
      </section>
      <details class="card tools-section" open>
        <summary><span data-i18n="supportedTools"></span><span id="tool-count" class="pill">0</span></summary>
        <p class="muted tools-hint" data-i18n="toolsHint"></p>
        <div id="supported-tools" class="tool-list"></div>
      </details>
      <section class="card log-card">
        <div class="section-title"><h2 data-i18n="debugLogs"></h2><span id="log-count" class="pill">0</span><span class="spacer"></span>
          <label class="sr-only" for="level" data-i18n="logLevel"></label>
          <select id="level"><option>DEBUG</option><option>INFO</option><option>WARNING</option><option>ERROR</option></select>
          <label class="sr-only" for="filter" data-i18n="filter"></label><input id="filter" type="search" data-placeholder="filter">
          <button id="follow" aria-pressed="true" data-i18n="follow"></button>
        </div>
        <div id="logs" class="logs" role="log" aria-label="Debug logs"></div>
      </section>
    </div>
    <section class="card chat">
      <div class="agent-tabs" role="tablist" data-label="agentPanels">
        <button id="tab-conversation" type="button" role="tab" aria-selected="true" aria-controls="panel-conversation" data-i18n="operator"></button>
        <button id="tab-system" type="button" role="tab" aria-selected="false" aria-controls="panel-system" tabindex="-1" data-i18n="systemPrompt"></button>
        <button id="tab-context" type="button" role="tab" aria-selected="false" aria-controls="panel-context" tabindex="-1" data-i18n="taskContext"></button>
      </div>
      <div class="agent-status"><span class="dot"></span><span id="agent-status" data-i18n="agentPending"></span><span class="spacer"></span><button id="stop-agent" type="button" disabled data-i18n="stopAgent"></button><button id="new-session" type="button" disabled data-i18n="newSession"></button></div>
      <div id="panel-conversation" class="agent-panel conversation-panel" role="tabpanel" aria-labelledby="tab-conversation">
      <div id="messages" class="messages" role="log" aria-label="Robot conversation">
        <div class="welcome"><div class="welcome-icon">S</div><h3 data-i18n="welcomeTitle"></h3><p data-i18n="welcomeBody"></p></div>
      </div>
      <div class="notice" id="chat-hint" hidden></div>
      <form id="composer" class="composer">
        <label class="sr-only" for="message" data-i18n="message"></label>
        <textarea id="message" rows="3" data-placeholder="messagePlaceholder" aria-describedby="chat-hint"></textarea>
        <button id="send" type="submit" disabled data-i18n="send"></button>
      </form>
      <div class="composer-note" data-i18n="draftHint"></div>
      </div>
      <div id="panel-system" class="agent-panel text-panel" role="tabpanel" aria-labelledby="tab-system" tabindex="0" hidden>
        <p class="notice" data-i18n="systemPromptHint"></p>
        <h3 data-i18n="configuredSystemPrompt"></h3>
        <pre id="system-prompt"></pre>
        <details class="brief-details" open>
          <summary data-i18n="operatorBrief"></summary>
          <pre id="operator-brief"></pre>
        </details>
      </div>
      <div id="panel-context" class="agent-panel text-panel" role="tabpanel" aria-labelledby="tab-context" tabindex="0" hidden>
        <p class="notice" data-i18n="taskContextHint"></p>
        <form id="context-form" class="context-form">
          <label for="context-editor" data-i18n="contextEditor"></label>
          <textarea id="context-editor" rows="10" maxlength="64000" disabled></textarea>
          <div class="context-actions"><button id="context-save" type="submit" disabled data-i18n="contextSave"></button><button id="context-reload" type="button" disabled data-i18n="contextReload"></button></div>
          <p id="context-status" class="muted" role="status"></p>
          <p id="context-error" class="notice error" role="alert" hidden></p>
        </form>
        <details class="brief-details"><summary data-i18n="contextCurrent"></summary><pre id="task-context"></pre></details>
        <div id="context-empty" class="panel-empty"><h3 data-i18n="contextEmpty"></h3><p data-i18n="contextEmptyHint"></p></div>
      </div>
    </section>
  </div>
  <footer><span data-i18n="footer"></span><span id="updated"></span></footer>
</main>
</body>
</html>
