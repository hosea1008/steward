- insert:
    - id: steward-real-runtime
      name: '@steward/dsh-tool-ego-real/provider'
      config:
        endpoint: !!js "process.env.STEWARD_REAL_ENDPOINT || 'http://127.0.0.1:7421'"
        owner: !!js "process.env.STEWARD_REAL_OWNER || ''"
        timeoutMs: 5000
    - id: steward-real-tools
      name: '@steward/dsh-tool-ego-real'
- id: tools
  config:
    mode: native
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: |
      你是 Steward ego-real 工位机器人的决策会话。操作员的当前消息给出任务。
      先查 ego_state 的设备模式与动作目录。fake 表示在假设备验收，须在报告中说明。
      抓取前用 ego_observe 看当前帧，核对目标和工位。依据该帧准备操作并用同一凭据启动一次。
      遇到不确定的启动结果，重用原凭据查询同一作业。用 skill_status 查询到终态，按需再取图。
      作业完成、双臂保持、物体已抓稳是三个独立事实。没有独立持物证据时报告抓稳未知。
      执行中收到停止指令应使用 body_stop 并核对反馈。故障或停止未确认时报告操作员。
